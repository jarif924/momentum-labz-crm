name: Daily CRM Reminders

on:
  schedule:
    - cron: '0 2 * * *' # Runs at 2:00 AM UTC every day
  workflow_dispatch: # Allows manual trigger

jobs:
  ping-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Reminders API
        env:
          CRM_CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error -H "Authorization: Bearer $CRM_CRON_SECRET" "https://crm.momentumlabzz.com/api/cron/reminders"
