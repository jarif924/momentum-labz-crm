name: CRM lead delivery typecheck
on:
  push:
    branches: [feature/website-enquiry-mail-delivery]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
